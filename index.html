<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9dce6"><meta name="description" content="رسالة حب صغيرة، لكِ وحدكِ."><meta property="og:title" content="حبيبة بابا"><title>حبيبة بابا | رسالة لكِ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{width:100%;margin:0;min-height:100%;overflow-x:hidden}body{font-family:Tajawal,system-ui,sans-serif;color:#873c5a;background:#fce5ee}button{font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #a52464;outline-offset:5px}
.scene{position:relative;isolation:isolate;display:grid;place-items:center;width:100%;min-height:100svh;min-height:100dvh;overflow:hidden;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px);background:radial-gradient(ellipse at 12% 10%,#fff 0,transparent 46%),radial-gradient(ellipse at 95% 92%,#ed9fc0 0,transparent 46%),linear-gradient(140deg,#ffedf3,#f8d4e1);transition:background 1.1s ease}
.scene:before,.scene:after{content:"";position:absolute;border:1px solid #fffd;border-radius:50%;width:70vw;aspect-ratio:1;top:-30vw;left:-25vw;z-index:-1}.scene:after{top:auto;left:auto;right:-25vw;bottom:-35vw}
.floaties,.spark-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}.floaties{z-index:-1}.spark-layer{z-index:5}.floater{position:absolute;bottom:-12vh;left:var(--x);font-size:var(--size);color:var(--color);opacity:0;animation:rise var(--duration) linear infinite;animation-delay:var(--delay)}.floater svg{width:1em;height:1em;fill:currentColor}@keyframes rise{0%{transform:translateY(0);opacity:0}13%{opacity:.52}86%{opacity:.47}100%{transform:translate(var(--drift),-120vh);opacity:0}}
.shell{position:relative;width:min(100%,480px);min-height:min(690px,calc(100dvh - 45px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px clamp(18px,6vw,48px) 38px;border:1px solid #fffd;border-radius:34px;background:linear-gradient(145deg,#fffd,#fff8f5b3);box-shadow:0 35px 90px #a8436b29,inset 0 1px #fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.shell:before{content:"";position:absolute;inset:11px;border:1px solid #eebdd188;border-radius:25px;pointer-events:none}.top{position:absolute;top:28px;left:0;right:0;color:#ae7088;font-weight:700;font-size:12px;letter-spacing:.06em}.top span{padding:0 10px;color:#d16f97}
.seal{position:relative;width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#fff8fc,#fbd2e0);border:1px solid #f0bad0;box-shadow:0 12px 26px #ba557b29;display:grid;place-items:center;margin-bottom:24px;color:#c85887;transition:transform .7s}.seal:after{content:"";position:absolute;inset:-8px;border:1px dashed #d393ae;border-radius:50%;animation:spin 65s linear infinite}.seal svg{height:39px;width:39px;fill:currentColor}@keyframes spin{to{transform:rotate(360deg)}}.eyebrow{font-size:clamp(12px,3vw,14px);font-weight:700;color:#ac7589;margin:0 0 8px}
.phrase-box{display:grid;place-items:center;min-height:clamp(95px,22vh,165px);width:100%}.phrase{font-family:Amiri,Georgia,serif;font-size:clamp(36px,9.5vw,62px);line-height:1.5;white-space:nowrap;max-width:100%;letter-spacing:-.045em;color:#933e61;text-shadow:0 3px 25px #fff9;margin:0}.phrase.long{font-size:clamp(29px,8vw,50px)}.phrase.out{animation:out .34s ease-in both}.phrase.in{animation:in .65s cubic-bezier(.22,1,.36,1) both}@keyframes out{to{opacity:0;transform:translateY(-16px) scale(.94);filter:blur(5px)}}@keyframes in{from{opacity:0;transform:translateY(25px) scale(.89);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.divider{display:flex;align-items:center;gap:13px;color:#c77b99;margin:5px 0 21px}.divider:before,.divider:after{content:"";display:block;width:30px;height:1px;background:linear-gradient(90deg,transparent,#d595af)}.divider:after{transform:rotate(180deg)}.hint{font-size:14px;color:#a17788;margin:0 0 27px;min-height:20px}.next{min-width:150px;height:59px;border:1px solid #b74b77;border-radius:999px;color:white;background:linear-gradient(135deg,#dd7aa4,#ac3868);font-size:25px;font-weight:700;padding-top:8px;box-shadow:0 13px 28px #b3447175,inset 0 1px #ffbad7;cursor:pointer;transition:transform .2s}.next:hover{transform:translateY(-2px)}.next:active{transform:scale(.94)}.next:disabled{opacity:.85}
.progress{direction:ltr;display:flex;gap:6px;justify-content:center;margin-top:35px}.pip{width:5px;height:5px;border-radius:999px;background:#e7bbcd;transition:all .35s}.pip.active{width:19px;background:#b74b77}.pip.passed{background:#d08cab}.foot{position:absolute;bottom:23px;color:#b9899a;font-size:12px}.replay{display:none;border:1px solid #d58dad;border-radius:999px;background:#fff9;padding:11px 24px;font-size:14px;font-weight:700;color:#99456b;cursor:pointer}
.spark{position:absolute;top:49%;left:50%;font-size:var(--size);color:var(--color);animation:burst var(--time) ease-out forwards;opacity:0}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.7) rotate(35deg)}}
.finale.scene{background:radial-gradient(ellipse at 50% 40%,#fff8fb,#f7c6d8 45%,#d67ba1)}.finale .shell{box-shadow:0 35px 100px #9f3f6980}.finale .seal{animation:beat 2.4s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1.09)}50%{transform:scale(1.19)}}.finale .phrase{font-size:clamp(20px,5.7vw,37px);letter-spacing:-.07em;color:#a42c66}.finale .phrase.in{animation:big .95s cubic-bezier(.22,1,.36,1) both}@keyframes big{from{opacity:0;transform:scale(.4);filter:blur(16px)}60%{transform:scale(1.11);filter:blur(0);opacity:1}to{transform:scale(1)}}.finale .next{display:none}.finale .replay{display:inline-flex}.finale .progress{opacity:0}
@media(max-height:690px){.shell{min-height:calc(100dvh - 25px);padding-top:40px}.top{top:17px}.seal{width:67px;height:67px;margin-bottom:13px}.seal svg{width:31px;height:31px}.phrase-box{min-height:85px}.hint{margin-bottom:16px}.progress{margin-top:18px}.foot{bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.floater{display:none}}
</style></head><body><main class="scene" id="scene"><div class="floaties" id="floaties" aria-hidden="true"></div><section class="shell" aria-label="رسالة حب"><div class="top"><span>♥</span>رسالة صغيرة لقلبك<span>♥</span></div><div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3.42 7.5 3.42c1.74 0 3.41.81 4.5 2.09a6.48 6.48 0 0 1 4.5-2.09C19.58 3.42 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg></div><p class="eyebrow" id="eyebrow">لأنكِ كل شيء حلو في دنيتي</p><div class="phrase-box" aria-live="polite" aria-atomic="true"><h1 class="phrase in" id="phrase">حبيبة بابا</h1></div><div class="divider" aria-hidden="true">♥</div><p class="hint" id="hint">وكل مرة، فيه شيء أحلى...</p><button id="next" class="next" type="button" aria-label="و؟، اكشفي العبارة التالية">و؟</button><button id="replay" class="replay" type="button">من البداية</button><div id="progress" class="progress"></div><div class="foot">صُنعت لكِ بحُب ♡</div></section><div id="sparks" class="spark-layer" aria-hidden="true"></div></main>
<script>
'use strict';const phrases=['حبيبة بابا','دنية بابا','عشق بابا','روح بابا','قلب بابا','عيون بابا','نبض بابا','عمر بابا','حياة بابا','غلا بابا','سعادة بابا','فرحة بابا','نور عيون بابا','جنة بابا','أميرة بابا'],finalText='للاااابببدددددددددد';const scene=document.getElementById('scene'),phrase=document.getElementById('phrase'),next=document.getElementById('next'),replay=document.getElementById('replay'),hint=document.getElementById('hint'),eyebrow=document.getElementById('eyebrow'),progress=document.getElementById('progress'),floaties=document.getElementById('floaties'),sparks=document.getElementById('sparks');const reduced=matchMedia('(prefers-reduced-motion: reduce)');let index=0,busy=false,timers=[],sparkTimer=null;const heart='<svg viewBox="0 0 24 24"><path d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3.42 7.5 3.42c1.74 0 3.41.81 4.5 2.09a6.48 6.48 0 0 1 4.5-2.09C19.58 3.42 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>';for(let i=0;i<17;i++){const e=document.createElement('span');e.className='floater';e.innerHTML=heart;e.style.setProperty('--x',((i*53+13)%98)+'%');e.style.setProperty('--size',(11+(i*7)%17)+'px');e.style.setProperty('--color',i%4===0?'#fff9':'#d66d9855');e.style.setProperty('--duration',(16+(i*3)%13)+'s');e.style.setProperty('--delay',(-i*1.9)+'s');e.style.setProperty('--drift',((i%2?-1:1)*(25+i%5*19))+'px');floaties.append(e)}
function progressUpdate(){progress.replaceChildren();for(let i=0;i<15;i++){const p=document.createElement('span');p.className='pip'+(i===index?' active':i<index?' passed':'');progress.append(p)}progress.setAttribute('aria-label','العبارة '+Math.min(index+1,15)+' من 15')}
function burst(n=9,large=false){if(reduced.matches)return;for(let i=0;i<n;i++){const e=document.createElement('span'),a=2*Math.PI*i/n,dist=(large?170:75)+Math.random()*(large?120:70);e.className='spark';e.textContent=i%4===0?'✦':'♥';e.style.setProperty('--size',(large?15+Math.random()*17:11+Math.random()*11)+'px');e.style.setProperty('--color',['#db5d91','#f6a4c4','#fff','#bc4377'][i%4]);e.style.setProperty('--tx',(Math.cos(a)*dist)+'px');e.style.setProperty('--ty',(Math.sin(a)*dist)+'px');e.style.setProperty('--time',large?'1.3s':'.8s');sparks.append(e);e.addEventListener('animationend',()=>e.remove(),{once:true})}}
function later(f,t){timers.push(setTimeout(f,t))}function go(){if(busy||index>=15)return;busy=true;next.disabled=true;phrase.className='phrase out';later(()=>{index++;const end=index===15;phrase.textContent=end?finalText:phrases[index];phrase.className='phrase'+(index===12?' long':'')+' in';if(end){scene.classList.add('finale');hint.textContent='أنتِ البداية، وأنتِ للأبد.';eyebrow.textContent='وبعد كل هذا الحب...';burst(44,true);later(()=>burst(24,true),450);if(!reduced.matches)sparkTimer=setInterval(()=>burst(10,true),4000)}else{hint.textContent=index>=12?'لسّه ما خلص الكلام الحلو...':'وكل مرة، فيه شيء أحلى...';burst()}progressUpdate();later(()=>{busy=false;next.disabled=false},end?1050:580)},reduced.matches?0:340)}
function restart(){timers.forEach(clearTimeout);timers=[];if(sparkTimer)clearInterval(sparkTimer);sparkTimer=null;index=0;busy=false;next.disabled=false;scene.classList.remove('finale');phrase.textContent=phrases[0];phrase.className='phrase in';hint.textContent='وكل مرة، فيه شيء أحلى...';eyebrow.textContent='لأنكِ كل شيء حلو في دنيتي';sparks.replaceChildren();progressUpdate()}next.addEventListener('click',go);replay.addEventListener('click',restart);progressUpdate();
</script></body></html>
